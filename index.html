<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>郭柏峰 & 張原榆｜Wedding Invitation</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: "Noto Serif TC", "Times New Roman", serif;
      color: #51463f;
      background: #f8f4ef;
      text-align: center;
    }
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 24px;
      background: linear-gradient(180deg, #f8f4ef, #eee3d8);
    }
    .eyebrow {
      letter-spacing: 5px;
      font-size: 12px;
      margin-bottom: 35px;
    }
    .names {
      font-size: clamp(30px, 8vw, 44px);
      line-height: 1.7;
      letter-spacing: 3px;
      margin: 0;
    }
    .ampersand {
      font-size: 24px;
      color: #b18b72;
      margin: 8px 0;
    }
    .divider {
      width: 55px;
      border: 0;
      border-top: 1px solid #b18b72;
      margin: 30px auto;
    }
    .date {
      font-size: 17px;
      letter-spacing: 2px;
    }
    .message {
      font-size: 15px;
      line-height: 2.2;
      margin-top: 35px;
    }
    .scroll {
      margin-top: 45px;
      font-size: 12px;
      letter-spacing: 3px;
      color: #8c786a;
    }
    section {
      padding: 65px 24px;
      line-height: 2;
    }
    h2 {
      font-size: 22px;
      font-weight: normal;
      letter-spacing: 3px;
    }
    .footer {
      padding: 30px 15px;
      background: #e9ddd1;
      font-size: 12px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="eyebrow">WEDDING INVITATION</div>
    <h1 class="names">郭柏峰</h1>
    <div class="ampersand">&</div>
    <h1 class="names">張原榆</h1>
    <hr class="divider">
    <div class="date">OUR WEDDING · 2026</div>
    <p class="message">
      歡迎與我們一起<br>
      分享人生中重要的時刻
    </p>
    <div class="scroll">SCROLL TO EXPLORE ↓</div>
  </main>
  <section>
    <h2>親愛的家人與朋友</h2>
    <p>
      感謝一路以來的陪伴與祝福。<br>
      誠摯邀請您與我們分享這份喜悅，<br>
      一起留下珍貴的回憶。
    </p>
  </section>
  <section>
    <h2>婚禮資訊</h2>
    <p>
      日期｜敬請期待<br>
      時間｜敬請期待<br>
      地點｜敬請期待
    </p>
  </section>
  <div class="footer">
    WITH LOVE · 郭柏峰 & 張原榆 · 2026
  </div>
</body>
</html>
